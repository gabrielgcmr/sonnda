# openapi.yaml
# NOTE: source entrypoint. Bundled, embedded and served at /openapi.yaml.
openapi: 3.0.3
info:
  title: Sonnda API
  version: "0.1.0"
  description: |-
    OpenAPI inicial das rotas HTTP da Sonnda.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://api.sonnda.com.br
    description: Produção
security:
  - bearerAuth: []
paths:
  # Public
  /:
    get:
      operationId: getApiMetadata
      summary: API metadata
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      security: []
      tags: [Public]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /docs:
    get:
      operationId: getApiDocs
      summary: API docs (Redoc)
      security: []
      tags: [Public]
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema:
                type: string
  # Me (usuário autenticado)
  /v1/me:
    $ref: "./openapi/paths/account.yaml#/me"
  /v1/me/patients:
    $ref: "./openapi/paths/patient-access.yaml#/current-account-patients"
  # patients
  /v1/patients:
    $ref: "./openapi/paths/patient.yaml#/collection"
  /v1/patients/{patientId}:
    $ref: "./openapi/paths/patient.yaml#/item"
  /v1/patients/{patientId}/labs:
    get:
      operationId: listPatientLabs
      summary: Listar laudos
      tags:
        - Labs
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: expand
          in: query
          required: false
          schema:
            type: string
            enum:
              - full
          description: Retorna a representação completa quando expand=full
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: "Lista de campos para expandir (ex.: results)"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabsList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadPatientLab
      summary: Upload de laudo
      tags: [Labs]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Laudo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabUploadResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/patients/{patientId}/exam-documents:
    post:
      operationId: uploadExamDocument
      summary: Enviar documento de exame
      tags: [ExamDocuments]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                collection_date:
                  type: string
                  format: date
      responses:
        "201":
          description: Documento recebido e classificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDocument"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/exam-documents/{documentId}:
    get:
      operationId: getExamDocument
      summary: Obter documento de exame
      tags: [ExamDocuments]
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documento de exame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDocument"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/patients/{patientId}/lab-reports:
    get:
      operationId: listPatientLabReports
      summary: Listar laudos laboratoriais
      tags: [LabReports]
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: expand
          in: query
          required: false
          schema:
            type: string
            enum: [full]
        - name: include
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Laudos do paciente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabsList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/lab-reports/{labReportId}:
    get:
      operationId: getLabReport
      summary: Obter laudo laboratorial
      tags: [LabReports]
      parameters:
        - name: labReportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Laudo laboratorial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabReportFull"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
# =========================
# Components
# =========================
components:
  # Security Schemes
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # Parameters
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador do paciente
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Número máximo de itens
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Número de itens para pular
  # Responses
  responses:
    Problem:
      description: Erro padronizado (RFC 9457 - Problem Details)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI que identifica o tipo do problema.
          example: urn:sonnda:problem:validation_failed
        title:
          type: string
          description: Resumo curto e legível do problema.
          example: Falha de validação
        status:
          type: integer
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Explicação específica desta ocorrência.
          example: entrada inválida
        instance:
          type: string
          description: URI que identifica a ocorrência específica do problema.
          example: urn:sonnda:request-id:8a0f8a9b-2e1c-4c46-a2b1-1a6f8a6c2e44
        code:
          type: string
          description: Código estável do erro (contrato Sonnda).
          example: VALIDATION_FAILED
        traceId:
          type: string
          description: Identificador para rastreamento (normalmente X-Request-ID).
          example: 8a0f8a9b-2e1c-4c46-a2b1-1a6f8a6c2e44
        timestamp:
          type: string
          format: date-time
          description: Timestamp (UTC) da ocorrência do erro.
          example: "2026-02-06T12:34:56Z"
        violations:
          type: array
          description: Lista de violações de validação (quando aplicável).
          items:
            type: object
            properties:
              field:
                type: string
                example: birth_date
              reason:
                type: string
                example: required
      required: [type, title, status, detail, code]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]
    RootResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
        docs:
          type: string
        openapi:
          type: string
        health:
          type: string
        ready:
          type: string
      required: [name, version, environment, docs, openapi, health, ready]
    CreateUserRequest:
      $ref: "./openapi/components/schemas/account.yaml#/CreateUserRequest"
    UpdateUserRequest:
      $ref: "./openapi/components/schemas/account.yaml#/UpdateUserRequest"
    CreatePatientRequest:
      $ref: "./openapi/components/schemas/patient.yaml#/CreatePatientRequest"
    PatientCreatedResponse:
      $ref: "./openapi/components/schemas/patient.yaml#/PatientCreatedResponse"
    User:
      $ref: "./openapi/components/schemas/account.yaml#/User"
    AccessiblePatientSummary:
      $ref: "./openapi/components/schemas/patient-access.yaml#/AccessiblePatientSummary"
    AccessiblePatientsResponse:
      $ref: "./openapi/components/schemas/patient-access.yaml#/AccessiblePatientsResponse"
    RelationshipType:
      $ref: "./openapi/components/schemas/patient-access.yaml#/RelationshipType"
    Patient:
      $ref: "./openapi/components/schemas/patient.yaml#/Patient"
    PatientsList:
      $ref: "./openapi/components/schemas/patient.yaml#/PatientsList"
    ExamDocument:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        uploaded_by_user_id:
          type: string
          format: uuid
        storage_uri:
          type: string
        original_filename:
          type: string
        mime_type:
          type: string
        status:
          type: string
        exam_type:
          type: string
          nullable: true
        extraction_method:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, patient_id, uploaded_by_user_id, storage_uri, original_filename, mime_type, status, created_at, updated_at]
    LabsList:
      description: |-
        Lista de laudos. Por padrao retorna a representacao resumida
        (LabReportSummaryList). Quando expand=full ou include contem full,
        results ou test_results, retorna LabReportFullList.
      oneOf:
        - $ref: "#/components/schemas/LabReportSummaryList"
        - $ref: "#/components/schemas/LabReportFullList"
    LabReportSummaryList:
      type: array
      items:
        $ref: "#/components/schemas/LabReportSummary"
    LabReportSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        report_date:
          type: string
          format: date-time
          nullable: true
        summary_tests:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LabResultSummary"
      required: [id, patient_id, summary_tests]
    LabResultSummary:
      type: object
      additionalProperties: false
      properties:
        test_name:
          type: string
        collected_at:
          type: string
          format: date-time
          nullable: true
        key_results:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LabResultItemSummary"
      required: [test_name, key_results]
    LabResultItemSummary:
      type: object
      additionalProperties: false
      properties:
        parameter_name:
          type: string
        result_value:
          type: string
          nullable: true
        result_unit:
          type: string
          nullable: true
      required: [parameter_name]
    LabReportFullList:
      type: array
      items:
        $ref: "#/components/schemas/LabReportFull"
    LabReportFull:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        patient_name:
          type: string
          nullable: true
        patient_dob:
          type: string
          format: date-time
          nullable: true
        lab_name:
          type: string
          nullable: true
        lab_phone:
          type: string
          nullable: true
        insurance_provider:
          type: string
          nullable: true
        requesting_doctor:
          type: string
          nullable: true
        technical_manager:
          type: string
          nullable: true
        report_date:
          type: string
          format: date-time
          nullable: true
        uploaded_by_user_id:
          type: string
          format: uuid
        fingerprint:
          type: string
          nullable: true
        test_results:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LabTestResultFull"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        [
          id,
          patient_id,
          uploaded_by_user_id,
          test_results,
          created_at,
          updated_at,
        ]
    LabTestResultFull:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        test_name:
          type: string
        material:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        collected_at:
          type: string
          format: date-time
          nullable: true
        release_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LabTestItemFull"
      required: [id, test_name, items]
    LabTestItemFull:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        parameter_name:
          type: string
        result_value:
          type: string
          nullable: true
        result_unit:
          type: string
          nullable: true
        reference_text:
          type: string
          nullable: true
      required: [id, parameter_name]
    LabUploadResponse:
      type: object
      description: Retorno do processamento do laudo.
      additionalProperties: true
