# openapi/paths/patient.yaml
collection:
  post:
    operationId: createPatient
    summary: Criar paciente
    tags: [Patient]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/CreatePatientRequest"
    responses:
      "201":
        description: Paciente criado
        headers:
          Location:
            description: Caminho do novo recurso
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/PatientCreatedResponse"
      "400":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "401":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "422":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "500":
        $ref: "../../openapi.yaml#/components/responses/Problem"
  get:
    operationId: listPatients
    summary: Listar pacientes
    tags: [Patient]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/PatientsList"
      "401":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "500":
        $ref: "../../openapi.yaml#/components/responses/Problem"
item:
  get:
    operationId: getPatient
    summary: Obter paciente
    tags: [Patient]
    parameters:
      - $ref: "../../openapi.yaml#/components/parameters/PatientId"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/Patient"
      "400":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "401":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "404":
        $ref: "../../openapi.yaml#/components/responses/Problem"
      "500":
        $ref: "../../openapi.yaml#/components/responses/Problem"
